
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | Cupking</title>

    <link rel="stylesheet" th:href="@{/css/fragments.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<main class="login-page">

    <section class="login-card">

        <a th:href="@{/}" class="brand">
            <span>♛</span>
            <span>cupking</span>
        </a>

        <div class="login-heading">
            <h1>Vamos adoçar seu dia?</h1>
            <p>Crie sua conta e tenha seus cupcakes favoritos sempre por perto.</p>
        </div>

        <form class="login-form"
              th:action="@{/cadastro}"
              th:object="${cadastro}"
              method="post">

            <div class="form-field">
                <label for="nome">Nome</label>
                <input
                        type="text"
                        id="nome"
                        th:field="*{nome}"
                        placeholder="Como podemos te chamar?"
                        autocomplete="name"
                        required
                >
                <span class="login-error"
                      th:if="${#fields.hasErrors('nome')}"
                      th:errors="*{nome}"></span>
            </div>

            <div class="form-field">
                <label for="email">E-mail</label>
                <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                >
                <span class="login-error"
                      th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}"></span>
            </div>

            <div class="form-field">
                <label for="senha">Senha</label>
                <input
                        type="password"
                        id="senha"
                        th:field="*{senha}"
                        placeholder="Mínimo de 8 caracteres"
                        autocomplete="new-password"
                        required
                >
                <span class="login-error"
                      th:if="${#fields.hasErrors('senha')}"
                      th:errors="*{senha}"></span>
            </div>

            <div class="form-field">
                <label for="confirmarSenha">Confirmar senha</label>
                <input
                        type="password"
                        id="confirmarSenha"
                        th:field="*{confirmarSenha}"
                        placeholder="Digite sua senha novamente"
                        autocomplete="new-password"
                        required
                >
                <span class="login-error"
                      th:if="${#fields.hasErrors('confirmarSenha')}"
                      th:errors="*{confirmarSenha}"></span>
            </div>

            <button type="submit" class="login-button">
                Criar minha conta
                <span>→</span>
            </button>

        </form>

        <div class="register-link">
            <span>Já tem uma conta?</span>
            <a th:href="@{/login}">Entrar</a>
        </div>

    </section>

</main>

</body>
</html>
