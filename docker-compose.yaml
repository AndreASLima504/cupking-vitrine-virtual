services:
  postgres:
    image: postgres:17
    container_name: cupking-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: cupking
      POSTGRES_USER: cupking
      POSTGRES_PASSWORD: cupking_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cupking -d cupking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: